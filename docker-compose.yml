services:
  db:
    image: postgres:16-alpine
    container_name: canteen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_canteen
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_pass
    ports:
      - "5433:5432"
    volumes:
      - canteen_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d smart_canteen"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: canteen_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smart_canteen
      DB_USER: canteen_user
      DB_PASSWORD: canteen_pass
      JWT_SECRET: change_this_to_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      SLOT_CAPACITY: 15
      SLOT_DURATION_MINUTES: 10
      # Demo accounts + starter menu are created automatically on start-up, so
      # all four portals can log in without any manual seed step.
      AUTO_SEED: "true"
      # Repairs the 7 demo accounts' passwords on every start. Set to "false"
      # (and change the demo passwords) before any real deployment.
      RESET_DEMO_PASSWORDS: "true"
      # Two weeks of sample orders, top-ups, refunds and failed payments (fresh database only),
      # so the manager's Transactions analysis and ML Insights are not empty on day one.
      SEED_DEMO_HISTORY: "true"
      # Payments: the QR is a DEMO UPI gateway (no real money). Set to "false" when a real gateway is integrated.
      PAYMENT_DEMO_GATEWAY: "true"
      PAYMENT_SESSION_MINUTES: 5
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: canteen_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4174:4173"

volumes:
  canteen_db_data:
